name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: unzip ElementMonitor.zip -d .

    - name: Find gradlew and set path
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found! Please use ZArchiver to zip the project."
          exit 1
        fi
        echo "Found gradlew at: $GRADLEW_PATH"
        echo "PROJECT_DIR=$(dirname $GRADLEW_PATH)" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ${{ env.PROJECT_DIR }}

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      working-directory: ${{ env.PROJECT_DIR }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/app-debug.apk'
